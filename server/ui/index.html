<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>網站內容管理</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head>
<body>
<header><a href="/" target="_blank" rel="noopener">ICAL <span>網站內容管理</span></a><button id="logout" hidden>登出</button></header>
<main>
<section id="login" class="login panel"><p class="eyebrow">ICAL · CONTENT MANAGEMENT</p><h1>歡迎回來</h1><p>登入後即可編輯與發布網站內容。</p><form id="login-form"><label for="password">管理密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">登入管理頁</button></form></section>
<div id="workspace" hidden><div class="intro"><div><p class="eyebrow">ICAL · CONTENT MANAGEMENT</p><h1>網站內容管理</h1><p>從清單選擇一筆資料編輯，照片可直接上傳。</p></div><div class="mode-links"><a class="visual-mode-link" href="/admin/visual">✎ 網頁編輯</a><a href="/" target="_blank" rel="noopener">查看公開網站 ↗</a></div></div>
<div class="layout"><nav id="categories" aria-label="內容類別"></nav><section class="panel editor"><form id="edit-form">
<div class="toolbar"><div><h2 id="title"></h2><p id="count"></p></div><div class="publish-actions"><span id="draft-state">所有修改皆已發布</span><button id="save" class="primary" type="submit">儲存並發布</button></div></div>
<div class="tools"><input id="search" type="search" placeholder="搜尋標題、年份或關鍵字" aria-label="搜尋內容"><button id="add" type="button">＋ 新增一筆</button></div>
<div id="record-workspace" class="record-workspace"><aside id="record-list" aria-label="資料清單"></aside><div class="record-editor"><div id="section-tabs" aria-label="編輯分區"></div><div id="fields"></div><div class="record-actions"><button id="delete-record" class="danger" type="button" hidden>刪除此筆</button></div></div></div>
</form></section></div></div>
<p id="status" role="status" aria-live="polite"></p>
</main><footer>內容更新後，公開網站會自動重新發布。</footer>
</body></html>
