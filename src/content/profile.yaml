researchAreas:
  - 人工智慧（專家系統與知識庫系統、自動推理系統、歸納邏輯程式、智慧代理人、知識驗證與確認）
  - 機器學習與軟式計算（資料探勘、分類、分群、符號式迴歸、演化式計算與基因規劃）
  - 機器人
  - 模糊邏輯理論與應用
  - 可演化硬體設計
  - 系統建模與 Petri Net
  - GPS
  - 平行與分散式系統（網格運算、多核心程式設計、GPU、雲端運算、虛擬化）
  - 抄襲偵測與垃圾郵件過濾
  - 資訊系統（平衡計分卡、電子商務、網際網路應用、遊戲）
interests:
  - 人工智慧與機器學習
