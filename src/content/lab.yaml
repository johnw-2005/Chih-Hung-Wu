name: I.C.A.L. 實驗室
nameEn: Intelligent Computation and Applications Laboratory
intro: |
  ICAL 實驗室以從事以 AI 技術（特別是 logic-based、machine learning、soft-computing 等）進行智慧型資訊系統的研究、設計與開發。
  本實驗室座落於國立高雄大學理工第一實驗大樓四樓（room 406-1），指導老師為吳志宏博士，成員為其研究生與專題指導學生。
  本實驗室的宗旨是結合 AI 技術以解決好玩的問題。

  歡迎有興趣的研究生與大學部學生加入。
mission:
  - 不會，要學（To Learn）
  - 要動手做（To Do）
  - 要好玩（To Have Fun）
