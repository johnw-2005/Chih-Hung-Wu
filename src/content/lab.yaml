introEn: Welcome to "Intelligent Computation and Applications Laboratory (ICAL＠ee.nuk.edu.tw)". We devote to the study, design, development, and implementation of intelligent information systems using AI-based techniques (especially logic-based, machine learning, soft-computing, etc.) The location of this lab is at room 406-1, the first science building, National University of Kaohsiung. Members of ICAL include Dr. Johnw Chih-Hung Wu (the supervisor) and his graduate and undergraduate students. We welcome graduate or undergraduate students who are interested in these topics to join with us.
researchTopics:
  - Artificial Intelligence & Machine Learning
  - Intelligent Robotics
  - Image/Vision Recognition
  - Deep Learning
  - Cloud Computing & Virtualization
  - Multi-Core & GPU Programming
