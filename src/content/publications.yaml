- id: journal-2021-006-local-binary-pattern
  bibKey: Johnw_Journal.bib:Johnw:2020:IMA
  bibType: article
  title: 'Local binary pattern encoding schemes for computed tomography image segmentation: An experimental and comparative study'
  order: 0
  type: journal
  authors:
    - Hsien-Jen Lo
    - Chih-Hung Wu*
  year: 2021
  journal: International Journal of Imaging Systems and Technology
  volume: '31'
  pages: 1300-1316
  abstract: 'Abstract Local binary patterns (LBPs) are used for effective texture representation in various applications. This study explores the clustering consistency and stability of image segmentation when distance-based clustering methods are used with an LBP. Because data are described by features and attributes, distances among data are also dominated by the definition of features. Moreover, four popular LBP encoding schemes for segmenting computed tomography (CT) images by using fuzzy C-means are discussed and compared. The experimental results demonstrate several notable phenomena: When the pixels are encoded in different LBP encoding schemes, the distance between these pixels varies considerably. The experimental results indicate that each LBP encoding scheme emphasizes a specific image texture that dominates how pixels are described in the feature space and thus affects the clustering results. Based on the evaluation of CT image segmentation by using the clustering inconsistency index, linear and corner-like LBPs are particularly suitable for clustering longitudinal sections and cross sections of CT images, respectively.'
  note: (SCI)
  issue: '3'
  keywords:
    - clustering
    - CT images
    - Euclidean distance
    - fuzzy C-means
    - image segmentation
    - local binary pattern
  indexes:
    - SCI
  doi: 10.1002/ima.22534
  url: https://onlinelibrary.wiley.com/doi/abs/10.1002/ima.22534
  eprint: https://onlinelibrary.wiley.com/doi/pdf/10.1002/ima.22534
